# Spring Boot Configuration
server.port=8080

# Database Configuration (MySQL + JDBC)
airline.db.url=jdbc:mysql://localhost:3306/airline_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
airline.db.username=root
airline.db.password=root

# Logging Configuration
logging.level.com.airline=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
